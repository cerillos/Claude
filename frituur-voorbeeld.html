<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frituur bestellen</title>
  <style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #fffaf0;
  color: #222;
}

header {
  background: #f2b705;
  padding: 1rem;
  text-align: center;
}
header h1 { margin: 0; }
header p { margin: 0.25rem 0 0; }

main {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
  padding: 1rem;
  max-width: 1100px;
  margin: 0 auto;
}

@media (min-width: 800px) {
  main { grid-template-columns: 2fr 1fr; }
  .persoon { grid-column: 1 / -1; }
  #bestelling { position: sticky; top: 1rem; align-self: start; }
}

.persoon input {
  display: block;
  width: 100%;
  max-width: 320px;
  padding: 0.5rem;
  font-size: 1rem;
  margin-top: 0.25rem;
}
.hint { font-size: 0.85rem; color: #666; margin: 0.25rem 0 0; }

.categorie h2 { border-bottom: 2px solid #f2b705; padding-bottom: 0.25rem; }

.item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid #eee;
}
.item .naam { flex: 1; }
.item .prijs { color: #555; min-width: 4.5rem; text-align: right; }

.teller { display: flex; align-items: center; gap: 0.4rem; }
.teller span { min-width: 1.5rem; text-align: center; font-weight: bold; }

button {
  font-size: 1rem;
  padding: 0.45rem 0.8rem;
  border: none;
  border-radius: 6px;
  background: #c0392b;
  color: #fff;
  cursor: pointer;
}
button.rond { width: 2.2rem; height: 2.2rem; padding: 0; border-radius: 50%; }
button.secundair { background: #777; }
button:disabled { opacity: 0.4; cursor: default; }

#bestelling {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 1rem;
}
.regel {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.25rem 0;
}
.regel small { color: #777; }
.leeg { color: #888; }
.totaal { font-size: 1.2rem; border-top: 2px solid #222; padding-top: 0.5rem; }
.knoppen { display: flex; gap: 0.5rem; flex-wrap: wrap; }

dialog { max-width: 500px; width: 90%; border-radius: 8px; }
dialog pre { white-space: pre-wrap; font-size: 0.95rem; }
</style>
</head>
<body>
  <header>
    <h1>Frituur bestellen</h1>
    <p>Stel samen een bestelling met meerdere snacks samen.</p>
  </header>

  <main>
    <section class="persoon">
      <label for="persoon">Voor wie bestelt u nu?</label>
      <input id="persoon" type="text" placeholder="Naam (optioneel)" maxlength="30" />
      <p class="hint">Vul een naam in om later per persoon af te rekenen.</p>
    </section>

    <section id="menu" aria-label="Menukaart"></section>

    <aside id="bestelling" aria-label="Bestelling">
      <h2>Uw bestelling</h2>
      <div id="regels"><p class="leeg">Nog niets gekozen.</p></div>
      <p class="totaal">Totaal: <strong id="totaal">€ 0,00</strong></p>
      <div class="knoppen">
        <button id="toon-overzicht" type="button">Overzicht voor de balie</button>
        <button id="leegmaken" type="button" class="secundair">Leegmaken</button>
      </div>
    </aside>
  </main>

  <dialog id="overzicht">
    <h2>Overzicht</h2>
    <pre id="overzicht-tekst"></pre>
    <div class="knoppen">
      <button id="kopieer" type="button">Kopiëren</button>
      <button id="sluiten" type="button" class="secundair">Sluiten</button>
    </div>
  </dialog>

  <script>
// Menukaart van de frituur. Prijzen zijn voorbeeldprijzen in euro's;
// pas ze aan naar de prijzen van uw eigen frituur.
const MENU = [
  {
    categorie: "Friet",
    items: [
      { id: "friet-klein", naam: "Friet klein", prijs: 2.75 },
      { id: "friet-middel", naam: "Friet middel", prijs: 3.5 },
      { id: "friet-groot", naam: "Friet groot", prijs: 4.25 },
    ],
  },
  {
    categorie: "Snacks",
    items: [
      { id: "frikandel", naam: "Frikandel", prijs: 2.5 },
      { id: "kroket", naam: "Kroket", prijs: 2.75 },
      { id: "bamischijf", naam: "Bamischijf", prijs: 2.75 },
      { id: "kaassouffle", naam: "Kaassoufflé", prijs: 2.75 },
      { id: "berenhap", naam: "Berenhap", prijs: 3.5 },
      { id: "viandel", naam: "Viandel", prijs: 3.0 },
      { id: "kipcorn", naam: "Kipcorn", prijs: 3.0 },
      { id: "loempia", naam: "Loempia", prijs: 4.0 },
      { id: "mexicano", naam: "Mexicano", prijs: 3.25 },
      { id: "kipnuggets", naam: "Kipnuggets (6 st.)", prijs: 3.75 },
    ],
  },
  {
    categorie: "Sauzen",
    items: [
      { id: "mayonaise", naam: "Mayonaise", prijs: 0.75 },
      { id: "curry", naam: "Curry", prijs: 0.75 },
      { id: "ketchup", naam: "Ketchup", prijs: 0.75 },
      { id: "satesaus", naam: "Satésaus", prijs: 1.0 },
      { id: "joppiesaus", naam: "Joppiesaus", prijs: 0.9 },
      { id: "uitjes", naam: "Uitjes", prijs: 0.5 },
    ],
  },
  {
    categorie: "Dranken",
    items: [
      { id: "cola", naam: "Cola", prijs: 2.5 },
      { id: "fanta", naam: "Fanta", prijs: 2.5 },
      { id: "water", naam: "Water", prijs: 2.25 },
    ],
  },
];
</script>
  <script>
// Bestelling: sleutel "persoon|itemId" -> aantal. Bedragen worden in centen
// berekend om afrondingsverschillen te voorkomen.
const OPSLAG_SLEUTEL = "frituur-bestelling";
const items = Object.fromEntries(MENU.flatMap((c) => c.items).map((i) => [i.id, i]));
const centen = (prijs) => Math.round(prijs * 100);
const euro = (c) => "€ " + (c / 100).toFixed(2).replace(".", ",");

let bestelling = laad();
const persoonVeld = document.getElementById("persoon");

function laad() {
  try {
    const data = JSON.parse(localStorage.getItem(OPSLAG_SLEUTEL)) || {};
    // Verwijder regels van producten die niet meer op de menukaart staan.
    return Object.fromEntries(
      Object.entries(data).filter(([k, n]) => items[k.split("|")[1]] && n > 0)
    );
  } catch {
    return {};
  }
}

function bewaar() {
  localStorage.setItem(OPSLAG_SLEUTEL, JSON.stringify(bestelling));
}

// "|" wordt verwijderd omdat dat teken de sleutel scheidt.
const huidigePersoon = () => persoonVeld.value.replace(/\|/g, "").trim();
const sleutel = (persoon, id) => persoon + "|" + id;

function wijzig(id, delta) {
  const k = sleutel(huidigePersoon(), id);
  const nieuw = (bestelling[k] || 0) + delta;
  if (nieuw > 0) bestelling[k] = nieuw;
  else delete bestelling[k];
  bewaar();
  render();
}

function regels() {
  return Object.entries(bestelling).map(([k, aantal]) => {
    const [persoon, id] = k.split("|");
    const item = items[id];
    return { persoon, item, aantal, bedrag: centen(item.prijs) * aantal };
  });
}

function renderMenu() {
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const persoon = huidigePersoon();
  for (const cat of MENU) {
    const sectie = document.createElement("div");
    sectie.className = "categorie";
    sectie.innerHTML = `<h2>${cat.categorie}</h2>`;
    for (const item of cat.items) {
      const aantal = bestelling[sleutel(persoon, item.id)] || 0;
      const rij = document.createElement("div");
      rij.className = "item";
      rij.innerHTML = `
        <span class="naam">${item.naam}</span>
        <span class="prijs">${euro(centen(item.prijs))}</span>
        <span class="teller">
          <button class="rond" type="button" data-id="${item.id}" data-delta="-1"
            aria-label="${item.naam} minder" ${aantal ? "" : "disabled"}>−</button>
          <span>${aantal}</span>
          <button class="rond" type="button" data-id="${item.id}" data-delta="1"
            aria-label="${item.naam} erbij">+</button>
        </span>`;
      sectie.appendChild(rij);
    }
    menu.appendChild(sectie);
  }
}

function renderBestelling() {
  const doel = document.getElementById("regels");
  const lijst = regels();
  if (!lijst.length) {
    doel.innerHTML = '<p class="leeg">Nog niets gekozen.</p>';
  } else {
    doel.innerHTML = "";
    for (const r of lijst) {
      const div = document.createElement("div");
      div.className = "regel";
      const wie = r.persoon ? ` <small>(${escape(r.persoon)})</small>` : "";
      div.innerHTML = `<span>${r.aantal}× ${r.item.naam}${wie}</span><span>${euro(r.bedrag)}</span>`;
      doel.appendChild(div);
    }
  }
  const totaal = lijst.reduce((s, r) => s + r.bedrag, 0);
  document.getElementById("totaal").textContent = euro(totaal);
  document.getElementById("toon-overzicht").disabled = !lijst.length;
  document.getElementById("leegmaken").disabled = !lijst.length;
}

function escape(tekst) {
  const d = document.createElement("div");
  d.textContent = tekst;
  return d.innerHTML;
}

function render() {
  renderMenu();
  renderBestelling();
}

// Tekst voor aan de balie: eerst alles opgeteld per product (in menuvolgorde),
// daarna per persoon wat ieder moet betalen.
function overzichtTekst() {
  const lijst = regels();
  const perItem = {};
  for (const r of lijst) perItem[r.item.id] = (perItem[r.item.id] || 0) + r.aantal;

  let tekst = "BESTELLING\n";
  for (const cat of MENU) {
    for (const item of cat.items) {
      if (perItem[item.id]) tekst += `${perItem[item.id]}× ${item.naam}\n`;
    }
  }
  const totaal = lijst.reduce((s, r) => s + r.bedrag, 0);
  tekst += `\nTotaal: ${euro(totaal)}\n`;

  const perPersoon = {};
  for (const r of lijst) {
    const wie = r.persoon || "Zonder naam";
    perPersoon[wie] = (perPersoon[wie] || 0) + r.bedrag;
  }
  if (Object.keys(perPersoon).length > 1) {
    tekst += "\nPER PERSOON\n";
    for (const [wie, bedrag] of Object.entries(perPersoon)) {
      tekst += `${wie}: ${euro(bedrag)}\n`;
    }
  }
  return tekst;
}

document.getElementById("menu").addEventListener("click", (e) => {
  const knop = e.target.closest("button[data-id]");
  if (knop) wijzig(knop.dataset.id, Number(knop.dataset.delta));
});

persoonVeld.addEventListener("input", renderMenu);

document.getElementById("leegmaken").addEventListener("click", () => {
  if (confirm("Hele bestelling leegmaken?")) {
    bestelling = {};
    bewaar();
    render();
  }
});

const dialoog = document.getElementById("overzicht");
document.getElementById("toon-overzicht").addEventListener("click", () => {
  document.getElementById("overzicht-tekst").textContent = overzichtTekst();
  dialoog.showModal();
});
document.getElementById("sluiten").addEventListener("click", () => dialoog.close());
document.getElementById("kopieer").addEventListener("click", async () => {
  const knop = document.getElementById("kopieer");
  try {
    await navigator.clipboard.writeText(overzichtTekst());
    knop.textContent = "Gekopieerd";
  } catch {
    knop.textContent = "Kopiëren mislukt";
  }
  setTimeout(() => (knop.textContent = "Kopiëren"), 1500);
});

render();
</script>
</body>
</html>
